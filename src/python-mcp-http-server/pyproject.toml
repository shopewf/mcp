[project]
name = "python-mcp-http-server"
version = "0.1.0"
description = "Minimal MCP HTTP server with FastAPI"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
  "mcp>=1.26.0",
  "oci==2.160.0",
  "uvicorn>=0.34.0",
  "starlette>=0.46.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

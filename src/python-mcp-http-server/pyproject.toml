[project]
name = "python-mcp-http-server"
version = "0.1.0"
description = "Minimal MCP HTTP server with FastAPI"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
  "fastapi>=0.108.0",
  "oci==2.160.0",
  "uvicorn>=0.24.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"